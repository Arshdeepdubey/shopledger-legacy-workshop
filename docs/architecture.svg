<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture</title>
  <desc id="desc">ShopLedger browser, Express server, routes, library modules, config and JSON store. A numbered sequence traces order placement through persistence and response.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
    <marker id="flowArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
      .title{font-size:24px;font-weight:700}.subtitle{font-size:13px;fill:#475569}
      .section{font-size:15px;font-weight:700}.label{font-size:13px;font-weight:700}.small{font-size:12px}
      .box{fill:#fff;stroke:#94a3b8;stroke-width:1.4;rx:8}.soft{fill:#f8fafc}
      .route{fill:#f0f9ff;stroke:#7dd3fc}.lib{fill:#f8fafc;stroke:#cbd5e1}
      .ticket{fill:#fff1f2;stroke:#e11d48;stroke-width:2}.ticketText{fill:#9f1239}
      .flow{fill:none;stroke:#2563eb;stroke-width:2.2;marker-end:url(#flowArrow)}
      .edge{fill:none;stroke:#64748b;stroke-width:1.4;marker-end:url(#arrow)}
      .dash{stroke-dasharray:5 4}
      .num{fill:#2563eb;stroke:#fff;stroke-width:2}.numtxt{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f1f5f9"/>
  <text x="28" y="36" class="title">ShopLedger · application architecture</text>
  <text x="28" y="58" class="subtitle">Express POS · Khata ledger · GST invoicing · JSON file persistence</text>

  <!-- Browser -->
  <rect x="25" y="88" width="190" height="188" class="box soft"/>
  <text x="42" y="113" class="section">Browser UI · public/</text>
  <text x="42" y="138" class="small">index.html</text>
  <text x="42" y="157" class="small">js/app.js</text>
  <text x="42" y="176" class="small">css/style.css</text>
  <text x="42" y="205" class="small">Catalog · cart preview</text>
  <text x="42" y="224" class="small">Orders · Khata · reports</text>
  <text x="42" y="243" class="small">Opens printable invoice</text>

  <!-- Server -->
  <rect x="250" y="88" width="250" height="188" class="box"/>
  <text x="268" y="113" class="section">server.js · Express app</text>
  <text x="268" y="138" class="small">express.static(public/)</text>
  <text x="268" y="158" class="small">Mounts four routers at /api</text>
  <text x="268" y="178" class="small">GET /orders/:id/invoice</text>
  <text x="268" y="198" class="small">orders.get → invoice.render</text>
  <text x="268" y="225" class="small">app.listen(config.port)</text>

  <!-- Config and data -->
  <rect x="535" y="88" width="195" height="188" class="box soft"/>
  <text x="553" y="113" class="section">config.js</text>
  <text x="553" y="140" class="small">port · shop identity</text>
  <text x="553" y="160" class="small">tax.defaultRate</text>
  <text x="553" y="180" class="small">tax.hsnSlabs</text>
  <text x="553" y="200" class="small">coupons · inventory rules</text>
  <rect x="765" y="88" width="205" height="188" class="box soft"/>
  <text x="783" y="113" class="section">data/db.json</text>
  <text x="783" y="140" class="small">products · customers</text>
  <text x="783" y="160" class="small">orders · settlements</text>
  <text x="783" y="180" class="small">auditLog · ID counters</text>
  <text x="783" y="214" class="small">lib/store.js</text>
  <text x="783" y="234" class="small">read · write · appendAudit</text>

  <!-- Routes -->
  <text x="25" y="316" class="section">Routers · mounted by server.js at /api</text>
  <rect x="25" y="329" width="275" height="120" class="box route"/>
  <text x="43" y="354" class="label">routes/products.js</text>
  <text x="43" y="378" class="small">GET /products · GET /coupons</text>
  <text x="43" y="402" class="small">inventory · tax · coupons</text>
  <rect x="315" y="329" width="330" height="120" class="box route"/>
  <text x="333" y="354" class="label">routes/orders.js</text>
  <text x="333" y="378" class="small">GET /orders · GET /orders/:id</text>
  <text x="333" y="398" class="small">POST /orders · POST /orders/:id/cancel</text>
  <text x="333" y="423" class="small">Order flow shown below ↓</text>
  <rect x="660" y="329" width="250" height="120" class="box route"/>
  <text x="678" y="354" class="label">routes/customers.js</text>
  <text x="678" y="378" class="small">GET /customers</text>
  <text x="678" y="398" class="small">POST /customers/:id/settle</text>
  <text x="678" y="423" class="small">ledger</text>
  <rect x="925" y="329" width="250" height="120" class="box route"/>
  <text x="943" y="354" class="label">routes/reports.js</text>
  <text x="943" y="378" class="small">dashboard · GST reconciliation</text>
  <text x="943" y="398" class="small">pricing preview · admin export</text>
  <text x="943" y="423" class="small">reports · pricing · coupons</text>

  <!-- Main flow numbers and arrows -->
  <text x="25" y="485" class="section">Order placement · numbered request path</text>
  <rect x="25" y="500" width="175" height="80" class="box soft"/>
  <circle cx="42" cy="500" r="12" class="num"/><text x="42" y="504" class="numtxt">1</text>
  <text x="48" y="526" class="label">Browser · app.js</text>
  <text x="48" y="548" class="small">POST /api/orders</text>
  <text x="48" y="567" class="small">items + coupon + payment</text>

  <rect x="225" y="500" width="175" height="80" class="box route"/>
  <circle cx="242" cy="500" r="12" class="num"/><text x="242" y="504" class="numtxt">2</text>
  <text x="248" y="526" class="label">routes/orders.js</text>
  <text x="248" y="548" class="small">resolve catalog items</text>
  <text x="248" y="567" class="small">validate stock + coupon</text>

  <rect x="425" y="500" width="175" height="80" class="box lib"/>
  <circle cx="442" cy="500" r="12" class="num"/><text x="442" y="504" class="numtxt">3</text>
  <text x="448" y="526" class="label">pricing.js</text>
  <text x="448" y="548" class="small">subtotal → discount</text>
  <text x="448" y="567" class="small">computeTotals → GST</text>

  <rect x="625" y="500" width="175" height="80" class="box lib"/>
  <circle cx="642" cy="500" r="12" class="num"/><text x="642" y="504" class="numtxt">4</text>
  <text x="648" y="526" class="label">tax.js · coupons.js</text>
  <text x="648" y="548" class="small">HSN slab + discount</text>
  <text x="648" y="567" class="small">totals returned</text>

  <rect x="825" y="500" width="175" height="80" class="box lib"/>
  <circle cx="842" cy="500" r="12" class="num"/><text x="842" y="504" class="numtxt">5</text>
  <text x="848" y="526" class="label">Khata · inventory</text>
  <text x="848" y="548" class="small">chargeOrderToKhata</text>
  <text x="848" y="567" class="small">reserve stock (if valid)</text>

  <rect x="1025" y="500" width="150" height="80" class="box lib"/>
  <circle cx="1042" cy="500" r="12" class="num"/><text x="1042" y="504" class="numtxt">6</text>
  <text x="1048" y="526" class="label">orders.add</text>
  <text x="1048" y="548" class="small">append order + ID</text>
  <text x="1048" y="567" class="small">audit + store.write</text>

  <path d="M200 540 H219" class="flow"/><path d="M400 540 H419" class="flow"/>
  <path d="M600 540 H619" class="flow"/><path d="M800 540 H819" class="flow"/>
  <path d="M1000 540 H1019" class="flow"/>
  <path d="M1100 580 V605 H1080" class="flow"/>
  <rect x="920" y="605" width="255" height="54" class="box soft"/>
  <circle cx="937" cy="605" r="12" class="num"/><text x="937" y="609" class="numtxt">7</text>
  <text x="957" y="628" class="label">Response · HTTP 201 order</text>
  <text x="957" y="648" class="small">browser refreshes catalog, ledger, dashboard</text>

  <!-- Supporting modules -->
  <rect x="25" y="605" width="860" height="132" class="box soft"/>
  <text x="43" y="630" class="section">lib/ · supporting modules and verified exports</text>
  <text x="43" y="654" class="small">orders.js: add · get · cancel · list</text>
  <text x="43" y="675" class="small">inventory.js: find · getSellableStock · check · reserve · release · summarize</text>
  <text x="43" y="696" class="small">ledger.js: findCustomer · listCustomers · chargeOrderToKhata · reverseOrderDebit · recordSettlement</text>
  <text x="43" y="717" class="small">coupons.js: normalizeCode · getCoupon · validate · calculateDiscount · listActive</text>
  <text x="460" y="654" class="small">pricing.js: subtotal · discount · computeTotals · round2</text>
  <text x="460" y="675" class="small">tax.js: getRateForItem · getSlabPercent · splitCgstSgst · round2</text>
  <text x="460" y="696" class="small">store.js: read · write · appendAudit</text>
  <text x="460" y="717" class="small">dates.js: today · normalizeDateKey · getFiscalYear · reports.js: getDashboardSummary · getGstReconciliation</text>

  <!-- Highlighted ticket module -->
  <rect x="25" y="748" width="860" height="38" class="ticket"/>
  <text x="43" y="772" class="label ticketText">TICKET · lib/invoice.js: computeInvoiceFigures · render</text>
  <text x="470" y="772" class="small ticketText">server.js serves it; reports.js uses it for reconciliation</text>

  <!-- Legend -->
  <rect x="920" y="682" width="255" height="104" class="box"/>
  <text x="938" y="706" class="label">Legend</text>
  <rect x="938" y="718" width="18" height="14" class="route"/><text x="965" y="730" class="small">HTTP router</text>
  <rect x="1055" y="718" width="18" height="14" class="lib"/><text x="1082" y="730" class="small">lib module</text>
  <rect x="938" y="744" width="18" height="14" class="ticket"/><text x="965" y="756" class="small">Ticket focus</text>
  <path d="M1055 751 H1074" class="flow"/><text x="1082" y="756" class="small">Order flow</text>
</svg>
